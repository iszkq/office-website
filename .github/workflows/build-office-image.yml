name: Build self-hosted Office image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-office-image.yml
      - Dockerfile
      - Caddyfile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - app/**
      - components/**
      - i18n/**
      - lib/**
      - messages/**
      - public/**
      - scripts/**
      - store/**
      - utils/**

permissions:
  contents: read
  packages: write

concurrency:
  group: office-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xinghuo-office
          tags: |
            type=raw,value=9.4.0.1-1
          labels: |
            org.opencontainers.image.title=Xinghuo Office
            org.opencontainers.image.description=Self-hosted browser Office editor for Xinghuo
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            DS_VERSION=9.4.0.1
            HASH=1
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Publish build summary
        run: |
          echo "### Office image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/xinghuo-office:9.4.0.1-1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
