name: Build self-hosted Office image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-office-image.yml
      - Dockerfile
      - Caddyfile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - app/**
      - components/**
      - i18n/**
      - lib/**
      - messages/**
      - public/**
      - scripts/**
      - store/**
      - utils/**

permissions:
  contents: read
  packages: write

concurrency:
  group: office-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/xinghuo-office
          tags: |
            type=raw,value=9.4.0.1-4
          labels: |
            org.opencontainers.image.title=Xinghuo Office
            org.opencontainers.image.description=Self-hosted browser Office editor for Xinghuo
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            DS_VERSION=9.4.0.1
            HASH=1
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Export offline Docker image
        id: archive
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/xinghuo-office:9.4.0.1-4
        run: |
          docker pull "$IMAGE_REF"
          docker save "$IMAGE_REF" | gzip -1 > xinghuo-office.tar.gz
          echo "size=$(du -h xinghuo-office.tar.gz | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum xinghuo-office.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload offline Docker image
        uses: actions/upload-artifact@v4
        with:
          name: xinghuo-office.tar.gz
          path: xinghuo-office.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish build summary
        run: |
          echo "### Office image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/xinghuo-office:9.4.0.1-4" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Offline archive: xinghuo-office.tar.gz (${{ steps.archive.outputs.size }})" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: ${{ steps.archive.outputs.sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the Artifacts section of this workflow run, unzip the artifact once, then run:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker load < xinghuo-office.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
